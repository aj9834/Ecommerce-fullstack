# Database
spring.config.import=optional:file:./application-local.properties

spring.datasource.url=jdbc:mysql://localhost:3306/ecommerce_db
spring.datasource.username=root
spring.datasource.password=as123

# JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# Server
server.port=8081

# JWT — secret must be at least 32 characters
jwt.secret=ecommerceSecretKey2024SuperSecureLongString
jwt.expiration=86400000

# Password reset
app.frontend.reset-password-url=http://localhost:5173/reset-password

# Mail - for Gmail, use your Gmail address and an app password:
# set MAIL_USERNAME=your.email@gmail.com
# set MAIL_PASSWORD=your-16-character-app-password
# Or create application-local.properties in the project root with:
# spring.mail.username=your.email@gmail.com
# spring.mail.password=your-16-character-app-password
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
app.mail.from=${MAIL_FROM:}

# Razorpay
# Never commit the key secret. Set both values in your shell/IDE run configuration.
razorpay.key.id=${RAZORPAY_KEY_ID:}
razorpay.key.secret=${RAZORPAY_KEY_SECRET:}
